<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>88 Homestay</title>
    <link rel="icon" type="image/png" href="/logo_cropped.png" />
    <link rel="shortcut icon" type="image/png" href="/logo_cropped.png" />
    <link rel="apple-touch-icon" href="/logo_cropped.png" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://yp88homestay.com/discover-yong-peng -> https://yp88homestay.com/?/discover-yong-peng
      //
      // If you're using a custom domain (e.g. yp88homestay.com) or project domain without a subdirectory,
      // pathSegmentsToKeep is 0. If hosted at username.github.io/repo-name/, it would be 1.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
